name: Build Linux installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build .deb and AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-bin \
            patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: bun install

      - name: Generate application icons
        run: |
          mkdir -p src-tauri/icons
          rsvg-convert -w 32 -h 32 src-tauri/icons/icon.svg > src-tauri/icons/32x32.png
          rsvg-convert -w 128 -h 128 src-tauri/icons/icon.svg > src-tauri/icons/128x128.png
          rsvg-convert -w 256 -h 256 src-tauri/icons/icon.svg > src-tauri/icons/128x128@2x.png
          rsvg-convert -w 512 -h 512 src-tauri/icons/icon.svg > src-tauri/icons/icon.png

      - name: Build Linux installers
        run: bun run tauri build -- --bundles deb,appimage

      - name: Upload installer files
        uses: actions/upload-artifact@v4
        with:
          name: keyquest-linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
