name: Build Native Windows Legacy Edition

on:
  push:
    branches:
      - native-windows-legacy
    paths:
      - "native-windows/**"
      - ".github/workflows/build-native-windows-legacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-wpf:
    name: Build native WPF application
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build native application
        run: dotnet build native-windows/KeyQuest.Academy.Native/KeyQuest.Academy.Native.csproj --configuration Release

      - name: Upload native application build
        uses: actions/upload-artifact@v4
        with:
          name: keyquest-native-windows-build
          path: native-windows/KeyQuest.Academy.Native/bin/Release/net461/
          if-no-files-found: error
          retention-days: 30
