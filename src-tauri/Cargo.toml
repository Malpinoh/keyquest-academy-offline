[package]
name = "keyquest-academy-offline"
version = "1.0.0"
description = "KeyQuest Academy offline desktop application"
authors = ["MALPINOH"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
# Pin Tauri's shared utility crate to the release used by the 2.11 line.
# Newer releases pull urlpattern 0.6, whose manifest needs Cargo edition2024 support.
tauri-utils = "=2.9.3"
# Keep the dependency compatible with the Rust toolchain required by this legacy target.
time = "=0.3.44"
# idna_adapter 1.2 pulls ICU 2.x, which requires Cargo edition2024.
# Version 1.1 uses the older Unicode backend and remains compatible with Cargo 1.77.
idna_adapter = "=1.1.0"
# Keep TOML serialization compatible with Cargo 1.77; newer toml_writer releases use edition 2024.
toml_writer = "=1.0.4"
